# Builds the Hugo site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
      HUGO_ENVIRONMENT: production
      HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
      TZ: Europe/Amsterdam
    steps:
      - name: Install Hugo (extended)
        run: |
          curl -sSLo ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
          hugo version

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lets Hugo read git dates for lastmod

      - id: pages
        uses: actions/configure-pages@v5

      # Resized images are cached between runs so builds stay fast (~10s instead of ~70s)
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.HUGO_CACHEDIR }}
            resources/_gen
          key: hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('content/**/*.jpg', 'content/**/*.png', 'assets/img/**') }}
          restore-keys: hugo-${{ env.HUGO_VERSION }}-

      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
