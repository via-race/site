# Decap CMS (free, open source): edit the site at https://via-race.com/admin/
# Every save is a Git commit; GitHub Actions rebuilds the site in ~1 minute.
# Setup (once): see README > "Editing without Git".
backend:
  name: github
  repo: OWNER/via-race          # <- change to the real GitHub repo
  branch: main
  base_url: https://via-cms-auth.ian-64c.workers.dev   # <- OAuth proxy Worker (see README)

publish_mode: editorial_workflow   # drafts -> review -> publish
media_folder: static/img/uploads
public_folder: /img/uploads
site_url: https://via-race.com
logo_url: https://via-race.com/icons/favicon.svg

collections:
  - name: diary
    label: Diary posts
    label_singular: Diary post
    folder: content/en/blog
    create: true
    path: "{{slug}}/index"       # page bundle: images live next to the post
    media_folder: ""
    public_folder: ""
    summary: "{{title}} ({{year}}-{{month}}-{{day}})"
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Short description, name: description, widget: text, hint: "Shown on cards and in Google results" }
      - { label: Publish date, name: date, widget: datetime }
      - label: Category
        name: categories
        widget: select
        multiple: true
        max: 1
        options: [interviews, stories, places, news, podcast, gallery]
      - label: Tags
        name: tags
        widget: select
        multiple: true
        required: false
        options: [chapter-1, chapter-2, chapter-3, riders, italy, spain, france]
      - { label: Cover image, name: image, widget: image, required: false }
      - { label: Photo gallery, name: gallery, widget: list, required: false, field: { label: Photo, name: photo, widget: image } }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: pages
    label: Pages
    files:
      - label: Home page
        name: home
        file: content/en/_index.md
        fields:
          - { label: Page title, name: title, widget: string }
          - { label: SEO description, name: description, widget: text }
          - { label: Hero title, name: hero_title, widget: string }
          - { label: Hero subtitle, name: hero_subtitle, widget: string }
          - { label: Intro title, name: intro_title, widget: string }
          - { label: Intro lead, name: intro_lead, widget: string }
          - label: Pillars
            name: pillars
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - { label: Map image (in assets/), name: map_image, widget: string }
          - { label: Map caption, name: map_caption, widget: text }
      - { label: About, name: about, file: content/en/about.md, fields: [ { label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }, { label: Body, name: body, widget: markdown } ] }
      - { label: Legal notice, name: legal, file: content/en/legal-notice.md, fields: [ { label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }, { label: Body, name: body, widget: markdown } ] }
      - { label: Privacy, name: privacy, file: content/en/privacy.md, fields: [ { label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }, { label: Body, name: body, widget: markdown } ] }
      - label: FAQ
        name: faq
        file: content/en/faq.md
        format: json-frontmatter
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Layout, name: layout, widget: hidden, default: faq }
          - { label: Last updated note, name: last_updated, widget: string }
          - label: Sections
            name: sections
            widget: list
            fields:
              - { label: Anchor id, name: id, widget: string }
              - { label: Title, name: title, widget: string }
              - label: Questions
                name: items
                widget: list
                summary: "{{fields.q}}"
                fields:
                  - { label: Question, name: q, widget: string }
                  - { label: Answer, name: a, widget: markdown }
          - label: Timeline
            name: timeline
            widget: list
            summary: "{{fields.date}}: {{fields.info}}"
            fields:
              - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: Info, name: info, widget: markdown }

  - name: settings
    label: Race & sponsors
    files:
      - label: Current race
        name: race
        file: data/race.yaml
        fields:
          - { label: Chapter, name: chapter, widget: string }
          - { label: Year, name: year, widget: number }
          - { label: Start location, name: start_location, widget: string }
          - { label: End location, name: end_location, widget: string }
          - { label: Distance, name: distance, widget: string }
          - { label: Elevation, name: elevation, widget: string }
          - { label: Start date, name: start_date, widget: datetime, time_format: false, format: "YYYY-MM-DD" }
          - { label: End date, name: end_date, widget: datetime, time_format: false, format: "YYYY-MM-DD" }
          - { label: Countries, name: route, widget: string }
      - label: Sponsors
        name: sponsors
        file: data/sponsors.yaml
        fields:
          - label: Sponsors
            name: sponsors
            widget: list
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Website, name: url, widget: string }
              - { label: Logo, name: logo, widget: image }
